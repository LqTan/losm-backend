services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: location-search-sqlserver-dev
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}

    volumes:
      - sqlserver-data:/var/opt/mssql

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: location-search-elasticsearch-dev
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health | grep -E 'green|yellow' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  n8n:
    image: n8nio/n8n:latest
    container_name: location-search-n8n-dev
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=n8n
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - GENERIC_TIMEZONE=Asia/Ho_Chi_Minh
      - N8N_METRICS=false
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
    volumes:
      - n8n-data:/home/node/.n8n
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: location-search-api-dev
    restart: unless-stopped
    ports:
      - "8082:8080"
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Elasticsearch__Url: http://elasticsearch:9200
    depends_on:
      sqlserver:
        condition: service_started
    networks:
      - location-search-dev-network

  web:
    image: node:20-alpine
    container_name: location-search-web-dev
    restart: unless-stopped
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_BASE_URL: http://api:8080
    volumes:
      - ../../frontend:/app
      - web-node-modules:/app/node_modules
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    depends_on:
      - api
    networks:
      - location-search-dev-network

networks:
  location-search-dev-network:

volumes:
  sqlserver-data:
  es-data:
  n8n-data:
  web-node-modules: