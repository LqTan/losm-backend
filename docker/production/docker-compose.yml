services:
  api:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: location-search-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8082}:8080"
    env_file:
      - .env.production
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Overture__DockerBin: "/usr/bin/docker"
      Frontend__BaseUrl: ${Frontend__BaseUrl:-https://losm.duckdns.org}
      Backend__BaseUrl: ${Backend__BaseUrl:-https://losm.duckdns.org}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp:/tmp
      - ../../backend/src/LocationSearch.Api/storage:/app/storage
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - location-search-network

  web:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-https://losm.duckdns.org}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://losm.duckdns.org}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-387601506011-gjo72l23fe97mr5irt6778dd9l7vd0sk.apps.googleusercontent.com}
        NEXT_PUBLIC_MAP_TILE_URL: ${NEXT_PUBLIC_MAP_TILE_URL:-}
        NEXT_PUBLIC_MAP_TILE_ATTRIBUTION: ${NEXT_PUBLIC_MAP_TILE_ATTRIBUTION:-}
        NEXT_PUBLIC_MAP_TILE_SUBDOMAINS: ${NEXT_PUBLIC_MAP_TILE_SUBDOMAINS:-}
    container_name: location-search-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      INTERNAL_API_URL: http://api:8080
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-https://losm.duckdns.org}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://losm.duckdns.org}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-387601506011-gjo72l23fe97mr5irt6778dd9l7vd0sk.apps.googleusercontent.com}
    depends_on:
      - api
    networks:
      - location-search-network

  overture-tools:
    build:
      context: ./overture
    image: overture-tools:latest
    container_name: location-search-overture-tools
    command: ["--help"]
    restart: "no"
    networks:
      - location-search-network

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: location-search-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: Express
    volumes:
      - location-search-sql-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -C -h -1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - location-search-network

