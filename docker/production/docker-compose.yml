services:

  tailscale:
    image: tailscale/tailscale:latest
    container_name: ts-location-search
    network_mode: service:sqlserver
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
    volumes:
      - tailscale-state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_started
    healthcheck:
      test: ["CMD", "tailscale", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      sh -c "
        tailscaled --statedir=/var/lib/tailscale &
        until tailscale status >/dev/null 2>&1; do sleep 2; done
        tailscale up --authkey=$$TS_AUTHKEY --hostname=ts-location-search --accept-routes
        wait
      "

  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: location-search-api
    restart: unless-stopped
    ports:
      - "8082:8080"
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
    depends_on:
      sqlserver:
        condition: service_started
    networks:
      - location-search-network

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: location-search-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - location-search-sql-data:/var/opt/mssql
    networks:
      - location-search-network

networks:
  location-search-network:

volumes:
  location-search-sql-data:
  tailscale-state:
