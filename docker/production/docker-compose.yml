services:
  api:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: location-search-api
    restart: unless-stopped
    ports:
      - "8082:8080"
    env_file:
      - .env.production
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Elasticsearch__Url: http://elasticsearch:9200
      Overture__DockerBin: "/usr/bin/docker"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      sqlserver:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - location-search-network

  web:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: location-search-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: http://api:8080
    depends_on:
      - api
    networks:
      - location-search-network

  overture-tools:
    build:
      context: ./overture
    image: overture-tools:latest
    container_name: location-search-overture-tools
    command: ["--help"]
    restart: "no"
    networks:
      - location-search-network

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: location-search-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: Express
    volumes:
      - location-search-sql-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -C -h -1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - location-search-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: location-search-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - location-search-es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health | grep -E 'green|yellow' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - location-search-network

networks:
  location-search-network:

volumes:
  location-search-sql-data:
  location-search-es-data: