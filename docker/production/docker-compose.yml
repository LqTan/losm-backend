services:
  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: location-search-api
    restart: unless-stopped
    ports:
      - "8082:8080"
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - location-search-network

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: location-search-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: Express
    volumes:
      - location-search-sql-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -C -h -1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - location-search-network

networks:
  location-search-network:

volumes:
  location-search-sql-data:
