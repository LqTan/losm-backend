<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>API Docs Login</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 320px;
      margin: 80px auto;
      padding: 0 16px;
      color: #1F6F8B;
    }
    h2 { margin-bottom: 24px; }
    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 12px;
      box-sizing: border-box;
      border: 1px solid #8ED8F8;
      border-radius: 6px;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #4FB6E9;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover { background: #1F6F8B; }
    #msg {
      color: #c00;
      min-height: 1em;
      margin-top: 16px;
      white-space: pre-wrap;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h2>API Docs Login</h2>
  <form id="f">
    <input name="email" type="email" placeholder="email" required>
    <input name="password" type="password" placeholder="password" required>
    <button type="submit">Login</button>
  </form>
  <pre id="msg"></pre>
  <script>
    document.getElementById('f').onsubmit = async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const msg = document.getElementById('msg');
      msg.textContent = '';
      try {
        const r = await fetch('/scalar/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: fd.get('email'),
            password: fd.get('password')
          })
        });
        if (r.ok) {
          window.location.href = '/scalar';
        } else {
          const text = await r.text();
          msg.textContent = 'Login failed (' + r.status + '): ' + text;
        }
      } catch (err) {
        msg.textContent = 'Error: ' + err.message;
      }
    };
  </script>
</body>
</html>
